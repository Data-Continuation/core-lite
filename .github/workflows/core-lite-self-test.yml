name: Core-Lite Self Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "core_lite/**"
      - "schemas/**"
      - "templates/**"
      - "examples/**"
      - ".stegverse/**"
      - ".github/workflows/core-lite-self-test.yml"

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out core-lite
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create mock consuming repo
        run: |
          mkdir -p /tmp/core-lite-target/incoming
          mkdir -p /tmp/core-lite-target/.stegverse
          mkdir -p /tmp/core-lite-target/tools/tasks

          cat > /tmp/core-lite-target/.stegverse/core-lite.json <<'JSON'
          {
            "schema": "stegverse_core_lite_policy.v1",
            "core_lite_version": "0.1.0",
            "repo_id": "TestOrg/TestRepo",
            "incoming_dir": "incoming",
            "success_dir": "legacy/ingested-bundles",
            "failed_dir": "legacy/failed-bundles",
            "registry_path": ".stegverse/org_registry.json",
            "default_task_manifest": "tools/tasks/test_tasks.json",
            "run_tasks_after_ingest": true
          }
          JSON

          cat > /tmp/core-lite-target/tools/tasks/test_tasks.json <<'JSON'
          {
            "name": "core-lite mock repo tasks",
            "version": "0.1.0",
            "tasks": [
              {
                "task_id": "write_task_output",
                "enabled": true,
                "description": "Write a deterministic task output.",
                "command": [
                  "python",
                  "-c",
                  "from pathlib import Path; Path('task_output.txt').write_text('ok\\n', encoding='utf-8')"
                ],
                "expected_outputs": [
                  "task_output.txt"
                ]
              }
            ]
          }
          JSON

      - name: Create test ingest bundle
        run: |
          mkdir -p /tmp/test-bundle/.stegverse
          mkdir -p /tmp/test-bundle/docs

          cat > /tmp/test-bundle/docs/hello.md <<'EOF'
          # Hello from core-lite

          This file was installed through a manifest-declared incoming bundle.
          EOF

          cat > /tmp/test-bundle/.stegverse/ingest_manifest.json <<'JSON'
          {
            "schema": "stegverse_ingest_manifest.v1",
            "bundle_id": "core-lite-self-test-bundle",
            "bundle_version": "0.1.0",
            "target_repo": "any",
            "purpose": "Verify core-lite can ingest a manifest-declared bundle.",
            "install_policy": {
              "default_action": "overwrite_declared_files_only",
              "preserve_runtime_artifacts": true,
              "preserve_unlisted_files": true,
              "fail_on_unclassified_files": true
            },
            "files": [
              {
                "path": "docs/hello.md",
                "class": "documentation",
                "action": "overwrite",
                "reason": "Self-test installed documentation file."
              },
              {
                "path": ".stegverse/ingest_manifest.json",
                "class": "ingest_manifest",
                "action": "read_before_install",
                "reason": "Classifies this test bundle before ingestion."
              }
            ]
          }
          JSON

          cd /tmp/test-bundle
          zip -r /tmp/core-lite-target/incoming/core-lite-self-test-bundle.zip .

      - name: Run core-lite against mock repo
        env:
          GITHUB_REPOSITORY: TestOrg/TestRepo
        run: |
          python core_lite/cli.py run --repo-root /tmp/core-lite-target

      - name: Verify outputs
        run: |
          test -f /tmp/core-lite-target/docs/hello.md
          test -f /tmp/core-lite-target/task_output.txt
          test -f /tmp/core-lite-target/core_lite_ingest_report.json
          test -f /tmp/core-lite-target/core_lite_run_summary.json
          test -f /tmp/core-lite-target/.stegverse/org_registry.json
          test -f /tmp/core-lite-target/.stegverse/receipts/core_lite_receipts.jsonl
          test -d /tmp/core-lite-target/legacy/ingested-bundles

      - name: Upload self-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-lite-self-test-artifacts
          path: |
            /tmp/core-lite-target/core_lite_ingest_report.json
            /tmp/core-lite-target/core_lite_run_summary.json
            /tmp/core-lite-target/declared_task_report.json
            /tmp/core-lite-target/.stegverse/org_registry.json
            /tmp/core-lite-target/.stegverse/receipts/core_lite_receipts.jsonl
            /tmp/core-lite-target/docs/hello.md
            /tmp/core-lite-target/task_output.txt
          if-no-files-found: error
