name: Core-Lite Self Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build mock core-lite target
        run: |
          set -euo pipefail

          TARGET="/tmp/core-lite-target"
          rm -rf "$TARGET"

          mkdir -p "$TARGET"
          mkdir -p "$TARGET/incoming"
          mkdir -p "$TARGET/.stegverse"
          mkdir -p "$TARGET/.github/workflows"
          mkdir -p "$TARGET/tools/tasks"

          cp -R core_lite "$TARGET/core_lite"
          cp -R schemas "$TARGET/schemas"

          if [ -d tools ]; then
            cp -R tools "$TARGET/tools"
          fi

          touch "$TARGET/incoming/.gitkeep"

          cat > "$TARGET/tools/tasks/core_lite_tasks.json" <<'JSON'
          {
            "name": "mock core-lite tasks",
            "version": "0",
            "tasks": []
          }
          JSON

          cat > "$TARGET/.stegverse/core-lite.json" <<'JSON'
          {
            "schema": "stegverse_core_lite_policy.v1",
            "core_lite_version": "self-test",
            "repo_id": "Data-Continuation/core-lite",
            "incoming_dir": "incoming",
            "success_dir": "legacy/ingested-bundles",
            "failed_dir": "legacy/failed-bundles",
            "superseded_dir": "legacy/superseded-bundles",
            "registry_path": ".stegverse/org_registry.json",
            "default_task_manifest": "tools/tasks/core_lite_tasks.json",
            "run_tasks_after_ingest": false,
            "required_repo_shims": [
              "incoming/.gitkeep",
              ".stegverse/core-lite.json",
              ".github/workflows/core-lite-intake.yml"
            ],
            "expected_workflows": [
              ".github/workflows/core-lite-intake.yml"
            ],
            "peer_ingestion_engines": []
          }
          JSON

          cat > "$TARGET/.github/workflows/core-lite-intake.yml" <<'YAML'
          name: Mock Core-Lite Intake

          on:
            workflow_dispatch:

          jobs:
            noop:
              runs-on: ubuntu-latest
              steps:
                - run: echo "mock intake workflow"
          YAML

      - name: Verify mock shims before run
        run: |
          set -euo pipefail

          TARGET="/tmp/core-lite-target"

          echo "Mock target file surface:"
          find "$TARGET" -maxdepth 4 -type f | sort

          test -f "$TARGET/incoming/.gitkeep"
          test -f "$TARGET/.stegverse/core-lite.json"
          test -f "$TARGET/.github/workflows/core-lite-intake.yml"
          test -f "$TARGET/core_lite/cli.py"
          test -f "$TARGET/core_lite/shims.py"
          test -f "$TARGET/schemas/manifest_admissibility_policy.json"
          test -f "$TARGET/schemas/ingestion_transition_table.json"

          echo "Required mock shims exist."

      - name: Run core-lite against mock repo
        env:
          GITHUB_REPOSITORY: Data-Continuation/core-lite
          GITHUB_EVENT_NAME: workflow_dispatch
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          python core_lite/cli.py run --repo-root /tmp/core-lite-target --skip-tasks

      - name: Validate mock output
        run: |
          set -euo pipefail

          test -f /tmp/core-lite-target/core_lite_run_summary.json
          test -f /tmp/core-lite-target/core_lite_queue_plan.json
          test -f /tmp/core-lite-target/core_lite_ingest_report.json
          test -f /tmp/core-lite-target/.stegverse/source_state_index.json
          test -f /tmp/core-lite-target/.stegverse/repo_shim_coverage_report.json
          test -f /tmp/core-lite-target/.stegverse/cge_fingerprint.json
          test -f /tmp/core-lite-target/.stegverse/receipts/core_lite_receipts.jsonl

          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("/tmp/core-lite-target/core_lite_run_summary.json").read_text())
          shim_report = json.loads(Path("/tmp/core-lite-target/.stegverse/repo_shim_coverage_report.json").read_text())

          drift_flags = set(summary.get("drift_flags", []))

          print(json.dumps({
              "summary": summary,
              "shim_report": shim_report
          }, indent=2, sort_keys=True))

          assert summary["ingest_success"] is True, summary
          assert summary["local_chain_valid"] is True, summary
          assert summary["parent_links_valid_locally"] is True, summary
          assert "missing_shim" not in drift_flags, summary

          print(json.dumps({
              "result": "pass",
              "ingest_success": summary["ingest_success"],
              "local_chain_valid": summary["local_chain_valid"],
              "parent_links_valid_locally": summary["parent_links_valid_locally"],
              "drift_flags": sorted(drift_flags),
          }, indent=2, sort_keys=True))
          PY

      - name: Upload self-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-lite-self-test-artifacts
          path: |
            /tmp/core-lite-target/core_lite_run_summary.json
            /tmp/core-lite-target/core_lite_queue_plan.json
            /tmp/core-lite-target/core_lite_ingest_report.json
            /tmp/core-lite-target/.stegverse/**
          if-no-files-found: warn
