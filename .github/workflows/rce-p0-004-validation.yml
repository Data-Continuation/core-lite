name: RCE P0-004 Automated Reconstruction Review

on:
  push:
    branches:
      - "stegops/rce-handoff-clean"
    paths:
      - "bundles/relationship_conditioned_execution/**"
      - "receipts/rce_p0_003_authoritative_validation.json"
      - "tools/reconstruct_relationship_conditioned_execution_bundle.py"
      - "tests/test_reconstruct_relationship_conditioned_execution_bundle.py"
      - ".github/workflows/rce-p0-004-validation.yml"
  pull_request:
    paths:
      - "tools/reconstruct_relationship_conditioned_execution_bundle.py"
      - "tests/test_reconstruct_relationship_conditioned_execution_bundle.py"
      - ".github/workflows/rce-p0-004-validation.yml"

permissions:
  contents: write

concurrency:
  group: rce-p0-004-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconstruct-review-persist:
    if: ${{ !contains(github.event.head_commit.message || '', '[rce-p0-004-state]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Run independent reconstruction review
        id: reconstruct
        run: python tools/reconstruct_relationship_conditioned_execution_bundle.py | tee rce-p0-004-reconstruction.txt

      - name: Run focused reconstruction tests
        id: tests
        run: python -m pytest -q tests/test_reconstruct_relationship_conditioned_execution_bundle.py | tee rce-p0-004-pytest.txt

      - name: Generate authoritative receipt and update task
        if: always()
        env:
          RECONSTRUCT_OUTCOME: ${{ steps.reconstruct.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          observed_at = datetime.now(timezone.utc).isoformat()
          report_path = Path("reports/rce_p0_004_reconstruction.json")
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else {}
          success = (
              os.environ.get("RECONSTRUCT_OUTCOME") == "success"
              and os.environ.get("TEST_OUTCOME") == "success"
              and report.get("decision") == "ALLOW_CANDIDATE_INTAKE"
              and report.get("destination_mutation_performed") is False
              and report.get("manual_actions_required") == []
          )

          receipt = {
              "schema": "stegverse.validation.receipt.v1",
              "receipt_id": f"rce-p0-004-github-actions-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
              "task_id": "RCE-P0-004",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "observed_at": observed_at,
              "validation_class": "GITHUB_ACTIONS_AUTHORITATIVE_RECONSTRUCTION_REVIEW",
              "authoritative_completion_evidence": success,
              "decision": report.get("decision", "DENY_CANDIDATE_INTAKE"),
              "destination_mutation_performed": False,
              "manual_actions_required": [],
              "outcomes": {
                  "independent_reconstruction": os.environ.get("RECONSTRUCT_OUTCOME"),
                  "focused_tests": os.environ.get("TEST_OUTCOME"),
              },
              "report_sha256": (
                  hashlib.sha256(report_path.read_bytes()).hexdigest()
                  if report_path.exists() else None
              ),
          }
          Path("receipts").mkdir(exist_ok=True)
          Path("receipts/rce_p0_004_authoritative_validation.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          task_path = Path("core_lite/tasks/relationship_conditioned_execution_p0_004.json")
          task = json.loads(task_path.read_text(encoding="utf-8"))
          task["status"] = "COMPLETE" if success else "VALIDATION_FAILED"
          task["validation"] = {
              "status": "PASS" if success else "FAIL",
              "workflow": ".github/workflows/rce-p0-004-validation.yml",
              "authoritative_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "authoritative_run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "authoritative_run_commit": os.environ["GITHUB_SHA"],
              "authoritative_receipt": "receipts/rce_p0_004_authoritative_validation.json",
              "authoritative_completion_evidence": success,
              "decision": receipt["decision"],
              "destination_mutation_performed": False,
              "manual_actions_required": [],
          }
          task["blocked_by"] = [] if success else ["reconstruction_or_policy_validation_failed"]
          if success:
              task["completed_at"] = observed_at
              task["successor_task"] = "RCE-P0-005 automated sandbox intake staging"
          task_path.write_text(json.dumps(task, indent=2) + "\n", encoding="utf-8")

          status_path = Path("reports/rce_automation_status.json")
          status = json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {}
          status.update({
              "schema": "stegverse.rce.automation_status.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "source_commit_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "observed_at": observed_at,
              "manual_actions_required": [],
              "rce_p0_004": {
                  "status": "COMPLETE" if success else "VALIDATION_FAILED",
                  "decision": receipt["decision"],
                  "receipt": "receipts/rce_p0_004_authoritative_validation.json",
                  "destination_mutation_performed": False,
              },
              "next_goal_candidate": (
                  "RCE-P0-005 automated sandbox intake staging"
                  if success else "repair_rce_p0_004_validation"
              ),
          })
          Path("reports").mkdir(exist_ok=True)
          status_path.write_text(json.dumps(status, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Persist reconstruction decision and evidence
        if: ${{ always() && github.event_name == 'push' }}
        run: |
          git config user.name "stegverse-rce-automation"
          git config user.email "actions@users.noreply.github.com"
          git add reports/rce_p0_004_reconstruction.json
          git add reports/rce_automation_status.json
          git add receipts/rce_p0_004_authoritative_validation.json
          git add core_lite/tasks/relationship_conditioned_execution_p0_004.json
          if git diff --cached --quiet; then
            echo "No reconstruction state change"
          else
            git commit -m "chore: persist RCE-P0-004 reconstruction state [rce-p0-004-state]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload redundant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rce-p0-004-authoritative-${{ github.run_id }}
          path: |
            reports/rce_p0_004_reconstruction.json
            reports/rce_automation_status.json
            receipts/rce_p0_004_authoritative_validation.json
            rce-p0-004-reconstruction.txt
            rce-p0-004-pytest.txt
          if-no-files-found: error
          retention-days: 90
