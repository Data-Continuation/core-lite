name: Core-Lite Reference Closure Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  pull_request:
    paths:
      - 'core_lite/reference_loop.json'
      - 'core_lite/reference_loop_state.json'
      - 'fixtures/typed_custody/**'
      - 'receipts/rce_p0_004_authoritative_validation.json'
      - 'receipts/rce_p0_005_authoritative_validation.json'
      - 'receipts/rce_p0_006_authoritative_validation.json'
      - 'tools/run_reference_loop.py'
      - 'tools/build_reference_loop_receipt_contract.py'
      - 'tools/build_reference_loop_site_status.py'
      - 'tools/build_reference_loop_portability_manifest.py'
      - 'tools/reconcile_rce_canonical_workstream.py'
      - 'tools/validate_typed_custody_evidence.py'
      - 'tests/test_run_reference_loop.py'
      - 'tests/test_build_reference_loop_receipt_contract.py'
      - 'tests/test_build_reference_loop_site_status.py'
      - 'tests/test_build_reference_loop_portability_manifest.py'
      - 'tests/test_reconcile_rce_canonical_workstream.py'
      - 'tests/test_validate_typed_custody_evidence.py'
      - '.github/workflows/reference-loop.yml'
  push:
    paths:
      - 'core_lite/reference_loop.json'
      - 'core_lite/reference_loop_state.json'
      - 'fixtures/typed_custody/**'
      - 'receipts/rce_p0_004_authoritative_validation.json'
      - 'receipts/rce_p0_005_authoritative_validation.json'
      - 'receipts/rce_p0_006_authoritative_validation.json'
      - 'tools/run_reference_loop.py'
      - 'tools/build_reference_loop_receipt_contract.py'
      - 'tools/build_reference_loop_site_status.py'
      - 'tools/build_reference_loop_portability_manifest.py'
      - 'tools/reconcile_rce_canonical_workstream.py'
      - 'tools/validate_typed_custody_evidence.py'
      - 'tests/test_run_reference_loop.py'
      - 'tests/test_build_reference_loop_receipt_contract.py'
      - 'tests/test_build_reference_loop_site_status.py'
      - 'tests/test_build_reference_loop_portability_manifest.py'
      - 'tests/test_reconcile_rce_canonical_workstream.py'
      - 'tests/test_validate_typed_custody_evidence.py'
      - '.github/workflows/reference-loop.yml'

permissions:
  contents: write

concurrency:
  group: core-lite-reference-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-implementation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install pyyaml pytest
      - name: Verify reference-loop implementation
        run: >-
          python -m pytest -q
          tests/test_run_reference_loop.py
          tests/test_build_reference_loop_receipt_contract.py
          tests/test_build_reference_loop_site_status.py
          tests/test_build_reference_loop_portability_manifest.py
          tests/test_reconcile_rce_canonical_workstream.py
          tests/test_validate_typed_custody_evidence.py
      - name: Validate canonical typed custody fixture
        run: python tools/validate_typed_custody_evidence.py fixtures/typed_custody/canonical_chain.json
      - name: Record exact-head validation identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('reports/typed_custody_exact_head_validation.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
            'decision': 'COMPLETE',
            'source_sha': os.environ['SOURCE_SHA'],
            'run_id': int(os.environ['RUN_ID']),
            'authority_effect': 'NONE',
            'next_task': 'MERGE_AND_EXACT_MAIN_VALIDATION',
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Upload typed custody validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: typed-custody-ingestion-validation
          path: |
            fixtures/typed_custody/canonical_chain.json
            reports/typed_custody_exact_head_validation.json
          if-no-files-found: error

  close-next-local-task:
    if: ${{ github.event_name != 'pull_request' }}
    needs: verify-implementation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install pyyaml pytest
      - name: Run one repository-local closure cycle
        id: reference_loop
        continue-on-error: true
        run: python tools/run_reference_loop.py
      - name: Record workflow outcome
        if: ${{ always() }}
        env:
          REFERENCE_LOOP_OUTCOME: ${{ steps.reference_loop.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, UTC
          from pathlib import Path
          path = Path('reports/reference_loop_workflow_outcome.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
            'generated_at': datetime.now(UTC).isoformat(timespec='seconds'),
            'event_name': os.environ['EVENT_NAME'],
            'source_sha': os.environ['SOURCE_SHA'],
            'run_id': int(os.environ['RUN_ID']),
            'reference_loop_outcome': os.environ['REFERENCE_LOOP_OUTCOME'],
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Persist state, reports, receipts, tasks, and sandbox evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name "Data-Continuation Reference Loop"
          git config user.email "reference-loop@data-continuation"
          git add -A \
            core_lite/reference_loop_state.json \
            core_lite/tasks/ \
            reports/ \
            receipts/ \
            sandbox/intake/relationship_conditioned_execution/ \
            sandbox/archive/relationship_conditioned_execution/ \
            sandbox/quarantine/relationship_conditioned_execution/ \
            sandbox/snapshots/relationship_conditioned_execution/ \
            sandbox/restoration_drills/relationship_conditioned_execution/ \
            sandbox/publication_candidates/relationship_conditioned_execution/ || true
          if git diff --staged --quiet; then
            echo "No reference-loop state changed."
          else
            git commit -m "core-lite: persist reference loop state [reference-loop-state]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload reference-loop evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-lite-reference-loop
          path: |
            core_lite/reference_loop.json
            core_lite/reference_loop_state.json
            reports/reference_loop_status.json
            reports/reference_loop_escalation.json
            reports/reference_loop_workflow_outcome.json
            reports/reference_loop_receipt_contract.json
            reports/reference_loop_site_status.json
            reports/reference_loop_portability_manifest.json
            reports/rce_session_reconciliation.json
            reports/typed_custody_exact_head_validation.json
            receipts/reference_loop_receipts.jsonl
            receipts/rce_p0_007_authoritative_validation.json
            receipts/rce_p0_008_authoritative_validation.json
            receipts/rce_p0_009_authoritative_validation.json
            receipts/rce_p0_010_authoritative_validation.json
            receipts/rce_p0_011_authoritative_validation.json
            receipts/rce_p0_012_authoritative_validation.json
            receipts/rce_p0_013_authoritative_validation.json
            receipts/rce_p0_014_authoritative_validation.json
          if-no-files-found: warn
      - name: Enforce fail-closed result after evidence persistence
        if: ${{ steps.reference_loop.outcome != 'success' }}
        run: |
          echo "The repository-local reference loop escalated after persisting evidence."
          exit 1
