name: Core-Lite Reference Closure Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  pull_request:
    paths:
      - 'core_lite/reference_loop.json'
      - 'tools/run_reference_loop.py'
      - 'tests/test_run_reference_loop.py'
      - '.github/workflows/reference-loop.yml'
  push:
    paths:
      - 'core_lite/reference_loop.json'
      - 'tools/run_reference_loop.py'
      - 'tests/test_run_reference_loop.py'
      - '.github/workflows/reference-loop.yml'

permissions:
  contents: write

concurrency:
  group: core-lite-reference-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-implementation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install pyyaml pytest
      - name: Verify reference-loop implementation
        run: python -m pytest -q tests/test_run_reference_loop.py

  close-next-local-task:
    if: ${{ github.event_name != 'pull_request' }}
    needs: verify-implementation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install pyyaml
      - name: Run one repository-local closure cycle
        id: reference_loop
        continue-on-error: true
        run: python tools/run_reference_loop.py
      - name: Record workflow outcome
        if: ${{ always() }}
        env:
          REFERENCE_LOOP_OUTCOME: ${{ steps.reference_loop.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, UTC
          from pathlib import Path
          path = Path('reports/reference_loop_workflow_outcome.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              'generated_at': datetime.now(UTC).isoformat(timespec='seconds'),
              'event_name': os.environ['EVENT_NAME'],
              'source_sha': os.environ['SOURCE_SHA'],
              'run_id': int(os.environ['RUN_ID']),
              'reference_loop_outcome': os.environ['REFERENCE_LOOP_OUTCOME'],
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Persist state, reports, receipts, and escalation evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name "Data-Continuation Reference Loop"
          git config user.email "reference-loop@data-continuation"
          git add -A \
            core_lite/reference_loop_state.json \
            reports/reference_loop_status.json \
            reports/reference_loop_escalation.json \
            reports/reference_loop_workflow_outcome.json \
            receipts/reference_loop_receipts.jsonl \
            reports/workstream_status.json \
            reports/workstream_status.md \
            receipts/workstream_receipts.jsonl || true
          if git diff --staged --quiet; then
            echo "No reference-loop state changed."
          else
            git commit -m "core-lite: persist reference loop state [reference-loop-state]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload reference-loop evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-lite-reference-loop
          path: |
            core_lite/reference_loop.json
            core_lite/reference_loop_state.json
            reports/reference_loop_status.json
            reports/reference_loop_escalation.json
            reports/reference_loop_workflow_outcome.json
            receipts/reference_loop_receipts.jsonl
          if-no-files-found: warn
      - name: Enforce fail-closed result after evidence persistence
        if: ${{ steps.reference_loop.outcome != 'success' }}
        run: |
          echo "The repository-local reference loop escalated after persisting evidence."
          exit 1
