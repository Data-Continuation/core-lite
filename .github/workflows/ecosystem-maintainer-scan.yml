name: Core-Lite Ecosystem Maintainer Scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'core_lite/workstreams.yml'
      - 'core_lite/transition_blocks.yml'
      - 'core_lite/friction_events.yml'
      - 'core_lite/bundle_registry.yml'
      - 'tools/validate_workstreams.py'
      - 'tools/ecosystem_maintainer.py'
      - 'tools/measure_friction.py'
      - 'tools/bundle_registry_report.py'
      - '.github/workflows/ecosystem-maintainer-scan.yml'

jobs:
  maintainer-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Validate workstreams
        run: python tools/validate_workstreams.py

      - name: Run ecosystem maintainer scan
        run: python tools/ecosystem_maintainer.py --root .

      - name: Upload ecosystem maintainer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-lite-ecosystem-maintainer-scan
          path: |
            reports/ecosystem_maintainer_scan.md
            reports/ecosystem_maintainer_scan.json
            receipts/ecosystem_maintainer_receipts.jsonl
          if-no-files-found: error
