name: Core-Lite Auto-Fix Eligibility

on:
  workflow_dispatch:
  push:
    paths:
      - 'core_lite/workstreams.yml'
      - 'core_lite/transition_blocks.yml'
      - 'tools/ecosystem_maintainer.py'
      - 'tools/auto_fix_eligibility.py'
      - 'github/workflows/auto-fix-eligibility.yml'

jobs:
  auto-fix-eligibility:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Validate workstreams
        run: python tools/validate_workstreams.py

      - name: Run ecosystem maintainer scan
        run: python tools/ecosystem_maintainer.py --root .

      - name: Generate auto-fix eligibility plan
        run: python tools/auto_fix_eligibility.py --root .

      - name: Upload auto-fix eligibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-lite-auto-fix-eligibility
          path: |
            reports/auto_fix_eligibility.md
            reports/auto_fix_eligibility.json
            receipts/auto_fix_eligibility_receipts.jsonl
          if-no-files-found: error
