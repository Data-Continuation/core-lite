name: RCE P0-003 Automated Bundle Validation

on:
  push:
    branches:
      - "stegops/rce-handoff-clean"
    paths:
      - "docs/RELATIONSHIP_CONDITIONED_HUMAN_DECISION_POLICY.md"
      - "docs/RCE_P0_002_MANIFEST_AND_FIXTURES.md"
      - "schemas/relationship_conditioned_human_decision_policy.schema.json"
      - "schemas/execution_candidate_manifest.schema.json"
      - "samples/relationship_conditioned_human_decision_policy.example.json"
      - "samples/execution_candidate_manifest.*.json"
      - "tools/build_relationship_conditioned_execution_bundle.py"
      - "tools/validate_relationship_conditioned_execution_bundle.py"
      - "tools/validate_relationship_conditioned_human_decision_policy.py"
      - "tools/validate_execution_candidate_manifest.py"
      - "tests/test_relationship_conditioned_execution_bundle.py"
      - ".github/workflows/rce-p0-003-validation.yml"
  pull_request:
    paths:
      - "tools/build_relationship_conditioned_execution_bundle.py"
      - "tools/validate_relationship_conditioned_execution_bundle.py"
      - "tests/test_relationship_conditioned_execution_bundle.py"
      - ".github/workflows/rce-p0-003-validation.yml"

permissions:
  contents: write

concurrency:
  group: rce-p0-003-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-validate-persist:
    if: ${{ !contains(github.event.head_commit.message || '', '[rce-p0-003-state]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Build deterministic bundle
        id: build
        run: python tools/build_relationship_conditioned_execution_bundle.py | tee rce-p0-003-build.txt

      - name: Validate deterministic bundle
        id: validate
        run: python tools/validate_relationship_conditioned_execution_bundle.py | tee rce-p0-003-validation.txt

      - name: Run focused bundle tests
        id: tests
        run: python -m pytest -q tests/test_relationship_conditioned_execution_bundle.py | tee rce-p0-003-pytest.txt

      - name: Generate authoritative receipt and update task
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          observed_at = datetime.now(timezone.utc).isoformat()
          success = all(
              os.environ.get(name) == "success"
              for name in ("BUILD_OUTCOME", "VALIDATE_OUTCOME", "TEST_OUTCOME")
          )

          outputs = [
              "bundles/relationship_conditioned_execution/bundle_manifest.json",
              "bundles/relationship_conditioned_execution/install_plan.json",
              "bundles/relationship_conditioned_execution/source_inventory.json",
              "tools/build_relationship_conditioned_execution_bundle.py",
              "tools/validate_relationship_conditioned_execution_bundle.py",
              "tests/test_relationship_conditioned_execution_bundle.py",
          ]
          digests = {
              value: hashlib.sha256(Path(value).read_bytes()).hexdigest()
              for value in outputs
              if Path(value).is_file()
          }

          receipt = {
              "schema": "stegverse.validation.receipt.v1",
              "receipt_id": f"rce-p0-003-github-actions-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
              "task_id": "RCE-P0-003",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "observed_at": observed_at,
              "validation_class": "GITHUB_ACTIONS_AUTHORITATIVE_VALIDATION",
              "authoritative_completion_evidence": success,
              "outcomes": {
                  "bundle_build": os.environ.get("BUILD_OUTCOME"),
                  "bundle_validation": os.environ.get("VALIDATE_OUTCOME"),
                  "focused_tests": os.environ.get("TEST_OUTCOME"),
              },
              "output_sha256": digests,
              "manual_actions_required": [],
          }
          Path("receipts").mkdir(exist_ok=True)
          Path("receipts/rce_p0_003_authoritative_validation.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          task_path = Path("core_lite/tasks/relationship_conditioned_execution_p0_003.json")
          task = json.loads(task_path.read_text(encoding="utf-8"))
          task["status"] = "COMPLETE" if success else "VALIDATION_FAILED"
          task["outputs_present"] = all(Path(value).is_file() for value in task["required_outputs"])
          task["validation"] = {
              "status": "PASS" if success else "FAIL",
              "workflow": ".github/workflows/rce-p0-003-validation.yml",
              "authoritative_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "authoritative_run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "authoritative_run_commit": os.environ["GITHUB_SHA"],
              "authoritative_receipt": "receipts/rce_p0_003_authoritative_validation.json",
              "authoritative_completion_evidence": success,
              "outcomes": receipt["outcomes"],
              "manual_actions_required": [],
          }
          task["blocked_by"] = [] if success else ["authoritative_validation_failed"]
          if success:
              task["completed_at"] = observed_at
              task["successor_task"] = "RCE-P0-004"
          task_path.write_text(json.dumps(task, indent=2) + "\n", encoding="utf-8")

          status_path = Path("reports/rce_automation_status.json")
          status = json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {}
          status.update({
              "schema": "stegverse.rce.automation_status.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "source_commit_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "observed_at": observed_at,
              "manual_actions_required": [],
              "rce_p0_003": {
                  "status": "COMPLETE" if success else "VALIDATION_FAILED",
                  "receipt": "receipts/rce_p0_003_authoritative_validation.json",
              },
              "next_goal_candidate": (
                  "RCE-P0-004 independent reconstruction and automated sandbox-intake decision"
                  if success else "repair_rce_p0_003_validation"
              ),
          })
          Path("reports").mkdir(exist_ok=True)
          status_path.write_text(json.dumps(status, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Persist generated package and evidence
        if: ${{ always() && github.event_name == 'push' }}
        run: |
          git config user.name "stegverse-rce-automation"
          git config user.email "actions@users.noreply.github.com"
          git add bundles/relationship_conditioned_execution/
          git add receipts/rce_p0_003_authoritative_validation.json
          git add reports/rce_automation_status.json
          git add core_lite/tasks/relationship_conditioned_execution_p0_003.json
          if git diff --cached --quiet; then
            echo "No generated state change"
          else
            git commit -m "chore: persist RCE-P0-003 package state [rce-p0-003-state]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload redundant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rce-p0-003-authoritative-${{ github.run_id }}
          path: |
            bundles/relationship_conditioned_execution/
            receipts/rce_p0_003_authoritative_validation.json
            reports/rce_automation_status.json
            rce-p0-003-build.txt
            rce-p0-003-validation.txt
            rce-p0-003-pytest.txt
          if-no-files-found: error
          retention-days: 90
