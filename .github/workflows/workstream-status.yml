name: Core-Lite Workstream Status

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'core_lite/**'
      - 'tools/**'
      - 'tests/test_manage_relationship_conditioned_execution_lifecycle.py'
      - 'tests/test_manage_relationship_conditioned_execution_lease.py'
      - 'tests/test_index_relationship_conditioned_execution_evidence.py'
      - 'tests/test_seal_relationship_conditioned_execution_snapshot.py'
      - 'tests/test_restore_relationship_conditioned_execution_snapshot.py'
      - 'tests/test_monitor_relationship_conditioned_execution_restoration.py'
      - 'tests/test_guard_relationship_conditioned_execution_restoration.py'
      - 'tests/test_run_reference_loop.py'
      - 'bundles/relationship_conditioned_execution/**'
      - 'sandbox/intake/relationship_conditioned_execution/**'
      - 'sandbox/snapshots/relationship_conditioned_execution/**'
      - 'sandbox/restoration_drills/relationship_conditioned_execution/**'
      - 'docs/CORE_LITE_MIRROR_HANDOFF.md'
      - '.github/workflows/workstream-status.yml'

permissions:
  contents: write

concurrency:
  group: core-lite-management-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-workstreams:
    if: ${{ github.event_name == 'schedule' || !contains(github.event.head_commit.message || '', '[core-lite-managed-state]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pyyaml pytest

      - name: Validate workstreams
        run: python tools/validate_workstreams.py

      - name: Validate StegClaw intake
        run: python tools/validate_stegclaw_intake.py

      - name: Run ecosystem maintainer scan
        run: python tools/ecosystem_maintainer.py --root .

      - name: Run auto-fix eligibility planner
        run: python tools/auto_fix_eligibility.py --root .

      - name: Run friction avoided metric
        run: python tools/measure_friction.py --root .

      - name: Run bundle registry report
        run: python tools/bundle_registry_report.py --root .

      - name: Run capability gap plan
        run: python tools/capability_gap_plan.py --root .

      - name: Validate StegVerse-002 export package
        run: python tools/validate_stegverse_002_export.py --root .

      - name: Verify reference closure implementation
        id: reference_loop_tests
        continue-on-error: true
        run: python -m pytest -q tests/test_run_reference_loop.py

      - name: Run one repository-local reference closure cycle
        id: reference_loop
        continue-on-error: true
        run: python tools/run_reference_loop.py

      - name: Reconcile RCE reconstruction and sandbox staging
        id: rce
        continue-on-error: true
        run: python tools/reconcile_relationship_conditioned_execution.py

      - name: Verify RCE custody and deterministic replay
        id: rce_custody
        continue-on-error: true
        run: python tools/verify_relationship_conditioned_execution_custody.py

      - name: Verify RCE lifecycle implementation
        id: rce_lifecycle_tests
        continue-on-error: true
        run: python -m pytest -q tests/test_manage_relationship_conditioned_execution_lifecycle.py

      - name: Reconcile RCE sandbox lifecycle and supersession
        id: rce_lifecycle
        continue-on-error: true
        run: python tools/manage_relationship_conditioned_execution_lifecycle.py

      - name: Verify RCE lease implementation
        id: rce_lease_tests
        continue-on-error: true
        run: python -m pytest -q tests/test_manage_relationship_conditioned_execution_lease.py

      - name: Reconcile RCE sandbox lease renewal and quarantine
        id: rce_lease
        continue-on-error: true
        run: python tools/manage_relationship_conditioned_execution_lease.py

      - name: Verify RCE reconstruction index implementation
        id: rce_index_tests
        continue-on-error: true
        run: python -m pytest -q tests/test_index_relationship_conditioned_execution_evidence.py

      - name: Build RCE reconstruction evidence index
        id: rce_index
        continue-on-error: true
        run: python tools/index_relationship_conditioned_execution_evidence.py

      - name: Verify RCE snapshot-seal implementation
        id: rce_snapshot_tests
        continue-on-error: true
        run: python -m pytest -q tests/test_seal_relationship_conditioned_execution_snapshot.py

      - name: Seal deterministic RCE evidence snapshot
        id: rce_snapshot
        continue-on-error: true
        run: python tools/seal_relationship_conditioned_execution_snapshot.py

      - name: Verify RCE snapshot restoration implementation
        id: rce_restore_tests
        continue-on-error: true
        run: python -m pytest -q tests/test_restore_relationship_conditioned_execution_snapshot.py

      - name: Run sealed RCE snapshot restoration drill
        id: rce_restore
        continue-on-error: true
        run: python tools/restore_relationship_conditioned_execution_snapshot.py

      - name: Verify RCE restoration divergence monitor
        id: rce_equivalence_tests
        continue-on-error: true
        run: python -m pytest -q tests/test_monitor_relationship_conditioned_execution_restoration.py

      - name: Attest RCE restoration equivalence
        id: rce_equivalence
        continue-on-error: true
        run: python tools/monitor_relationship_conditioned_execution_restoration.py

      - name: Verify RCE persistent divergence guard
        id: rce_guard_tests
        continue-on-error: true
        run: python -m pytest -q tests/test_guard_relationship_conditioned_execution_restoration.py

      - name: Guard RCE restoration and preserve quarantine evidence
        id: rce_guard
        continue-on-error: true
        run: python tools/guard_relationship_conditioned_execution_restoration.py

      - name: Persist managed step outcomes
        if: always()
        env:
          REFERENCE_LOOP_TESTS: ${{ steps.reference_loop_tests.outcome }}
          REFERENCE_LOOP: ${{ steps.reference_loop.outcome }}
          RCE: ${{ steps.rce.outcome }}
          RCE_CUSTODY: ${{ steps.rce_custody.outcome }}
          RCE_LIFECYCLE_TESTS: ${{ steps.rce_lifecycle_tests.outcome }}
          RCE_LIFECYCLE: ${{ steps.rce_lifecycle.outcome }}
          RCE_LEASE_TESTS: ${{ steps.rce_lease_tests.outcome }}
          RCE_LEASE: ${{ steps.rce_lease.outcome }}
          RCE_INDEX_TESTS: ${{ steps.rce_index_tests.outcome }}
          RCE_INDEX: ${{ steps.rce_index.outcome }}
          RCE_SNAPSHOT_TESTS: ${{ steps.rce_snapshot_tests.outcome }}
          RCE_SNAPSHOT: ${{ steps.rce_snapshot.outcome }}
          RCE_RESTORE_TESTS: ${{ steps.rce_restore_tests.outcome }}
          RCE_RESTORE: ${{ steps.rce_restore.outcome }}
          RCE_EQUIVALENCE_TESTS: ${{ steps.rce_equivalence_tests.outcome }}
          RCE_EQUIVALENCE: ${{ steps.rce_equivalence.outcome }}
          RCE_GUARD_TESTS: ${{ steps.rce_guard_tests.outcome }}
          RCE_GUARD: ${{ steps.rce_guard.outcome }}
        run: |
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          keys = [
              'REFERENCE_LOOP_TESTS','REFERENCE_LOOP','RCE','RCE_CUSTODY',
              'RCE_LIFECYCLE_TESTS','RCE_LIFECYCLE','RCE_LEASE_TESTS','RCE_LEASE',
              'RCE_INDEX_TESTS','RCE_INDEX','RCE_SNAPSHOT_TESTS','RCE_SNAPSHOT',
              'RCE_RESTORE_TESTS','RCE_RESTORE','RCE_EQUIVALENCE_TESTS','RCE_EQUIVALENCE',
              'RCE_GUARD_TESTS','RCE_GUARD'
          ]
          outcomes = {key.lower(): os.environ.get(key, 'unknown') for key in keys}
          failed = sorted(key for key, value in outcomes.items() if value != 'success')
          report = {
              'schema': 'stegverse.core_lite.managed_step_outcomes.v1',
              'generated_at': datetime.datetime.now(datetime.UTC).isoformat(timespec='seconds'),
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'commit_sha': os.environ.get('GITHUB_SHA'),
              'outcomes': outcomes,
              'failed_steps': failed,
              'result': 'pass' if not failed else 'fail_closed'
          }
          path = Path('reports/managed_step_outcomes.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Publish managed reports, receipts, task state, and sandbox evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Data-Continuation Core-Lite Manager"
          git config user.email "core-lite-manager@data-continuation"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add -A \
            reports/ receipts/ core_lite/tasks/ core_lite/reference_loop_state.json \
            sandbox/intake/relationship_conditioned_execution/ \
            sandbox/archive/relationship_conditioned_execution/ \
            sandbox/quarantine/relationship_conditioned_execution/ \
            sandbox/snapshots/relationship_conditioned_execution/ \
            sandbox/restoration_drills/relationship_conditioned_execution/ || true
          if git diff --staged --quiet; then
            echo "No managed state changed."
          else
            git commit -m "core-lite: publish managed state [core-lite-managed-state]"
            git push
          fi

      - name: Upload workstream and management artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-lite-workstream-status
          path: |
            reports/workstream_status.md
            reports/workstream_status.json
            receipts/workstream_receipts.jsonl
            reports/reference_loop_status.json
            reports/reference_loop_escalation.json
            reports/reference_loop_workflow_outcome.json
            reports/managed_step_outcomes.json
            receipts/reference_loop_receipts.jsonl
            core_lite/reference_loop_state.json
            reports/stegclaw_target_intake.json
            reports/ecosystem_maintainer_scan.md
            reports/ecosystem_maintainer_scan.json
            receipts/ecosystem_maintainer_receipts.jsonl
            reports/auto_fix_eligibility.md
            reports/auto_fix_eligibility.json
            receipts/auto_fix_eligibility_receipts.jsonl
            reports/friction_avoided.md
            reports/friction_avoided.json
            receipts/friction_avoided_receipts.jsonl
            reports/bundle_registry.md
            reports/bundle_registry.json
            receipts/bundle_registry_receipts.jsonl
            reports/capability_gap_plan.md
            reports/capability_gap_plan.json
            receipts/capability_gap_receipts.jsonl
            reports/stegverse_002_export_manifest.md
            reports/stegverse_002_export_manifest.json
            receipts/stegverse_002_export_receipts.jsonl
            reports/rce_p0_004_reconstruction.json
            reports/rce_p0_006_custody_replay.json
            reports/rce_p0_007_lifecycle.json
            reports/rce_p0_008_lease.json
            reports/rce_p0_009_reconstruction_index.json
            reports/rce_p0_010_snapshot_seal.json
            reports/rce_p0_011_restoration_drill.json
            reports/rce_p0_012_restoration_equivalence.json
            reports/rce_p0_013_divergence_guard.json
            reports/rce_automation_status.json
            receipts/rce_p0_004_authoritative_validation.json
            receipts/rce_p0_005_authoritative_validation.json
            receipts/rce_p0_006_authoritative_validation.json
            receipts/rce_p0_007_authoritative_validation.json
            receipts/rce_p0_008_authoritative_validation.json
            receipts/rce_p0_009_authoritative_validation.json
            receipts/rce_p0_010_authoritative_validation.json
            receipts/rce_p0_011_authoritative_validation.json
            receipts/rce_p0_012_authoritative_validation.json
            receipts/rce_p0_013_authoritative_validation.json
            sandbox/intake/relationship_conditioned_execution/staging_manifest.json
            sandbox/intake/relationship_conditioned_execution/lifecycle_state.json
            sandbox/intake/relationship_conditioned_execution/lease_state.json
            sandbox/snapshots/relationship_conditioned_execution/snapshot_manifest.json
            sandbox/restoration_drills/relationship_conditioned_execution/restoration_manifest.json
            sandbox/quarantine/relationship_conditioned_execution/divergence_alert.json
          if-no-files-found: warn

      - name: Enforce managed results
        if: ${{ steps.reference_loop_tests.outcome != 'success' || steps.reference_loop.outcome != 'success' || steps.rce.outcome != 'success' || steps.rce_custody.outcome != 'success' || steps.rce_lifecycle_tests.outcome != 'success' || steps.rce_lifecycle.outcome != 'success' || steps.rce_lease_tests.outcome != 'success' || steps.rce_lease.outcome != 'success' || steps.rce_index_tests.outcome != 'success' || steps.rce_index.outcome != 'success' || steps.rce_snapshot_tests.outcome != 'success' || steps.rce_snapshot.outcome != 'success' || steps.rce_restore_tests.outcome != 'success' || steps.rce_restore.outcome != 'success' || steps.rce_equivalence_tests.outcome != 'success' || steps.rce_equivalence.outcome != 'success' || steps.rce_guard_tests.outcome != 'success' || steps.rce_guard.outcome != 'success' }}
        run: |
          echo "Managed verification failed closed after state and outcome persistence."
          cat reports/managed_step_outcomes.json
          exit 1
