name: Core-Lite Workstream Status (Superseded)

# The repository-local reference closure loop is the sole execution claimant:
#   .github/workflows/reference-loop.yml
#   core_lite/reference_loop.json#REF-LOOP-007
#
# The former workflow and its implementation remain inspectable in Git history,
# but this file has no executable job or recurring trigger. This prevents
# duplicate RCE lifecycle, lease, snapshot, restoration, guard, and checkpoint
# mutation outside the canonical lease and hash-chained receipt mechanism.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Superseded by the Core-Lite Reference Closure Loop; no execution performed."
