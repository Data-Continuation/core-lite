name: Core-Lite Bundle Registry

on:
  workflow_dispatch:
  push:
    paths:
      - 'core_lite/bundle_registry.yml'
      - 'core_lite/transition_blocks.yml'
      - 'tools/bundle_registry_report.py'
      - 'github/workflows/bundle-registry.yml'

jobs:
  bundle-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Validate workstreams
        run: python tools/validate_workstreams.py

      - name: Generate bundle registry report
        run: python tools/bundle_registry_report.py --root .

      - name: Upload bundle registry artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-lite-bundle-registry
          path: |
            reports/bundle_registry.md
            reports/bundle_registry.json
            receipts/bundle_registry_receipts.jsonl
          if-no-files-found: error
