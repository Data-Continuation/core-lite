# core-lite bootstrap installer workflow
#
# ROOT-UPLOAD INSTRUCTIONS:
#
# 1. Upload this package's contents to the repository root:
#      run.yml
#      core-lite-bootstrap-manifest-v001.json
#      core-lite-clean-repo-upload-v001.zip
#
# 2. Move or recreate this file at the required GitHub Actions path:
#      .github/workflows/run.yml
#
#    If GitHub web UI does not let you move a root file into a new hidden path,
#    create this path manually:
#      .github/workflows/run.yml
#    then paste the full contents of this run.yml file into it.
#
# 3. Commit the workflow file.
#
# 4. Go to:
#      Actions -> Install core-lite bundle -> Run workflow
#
# 5. The workflow will:
#      - find core-lite-clean-repo-upload-v001.zip
#      - extract it
#      - copy the extracted files into the repository root
#      - remove generated caches
#      - commit the installed core-lite files
#      - push the commit
#
# IMPORTANT:
# - GitHub Actions only recognizes workflows under:
#      .github/workflows/
#
# - A root-level run.yml is only a staging file.
#
# - The visible helper path can be described as:
#      github/workflows/run.yml
#   but the real required path is:
#      .github/workflows/run.yml
#
# DONE MEANS:
# - src/core_lite/ exists
# - examples/ exists
# - tests/ exists
# - .github/workflows/test.yml exists
# - the core-lite-test workflow runs successfully

name: Install core-lite bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm bundle exists
        run: |
          test -f core-lite-clean-repo-upload-v001.zip
          echo "Found core-lite-clean-repo-upload-v001.zip"

      - name: Extract bundle
        run: |
          rm -rf _core_lite_extract
          mkdir -p _core_lite_extract
          unzip -o core-lite-clean-repo-upload-v001.zip -d _core_lite_extract
          echo "Extracted bundle contents:"
          find _core_lite_extract -maxdepth 4 -type f | sort

      - name: Install bundle into repo root
        run: |
          rsync -a _core_lite_extract/ ./
          rm -rf _core_lite_extract
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          rm -rf .pytest_cache out export

      - name: Verify installed layout
        run: |
          test -f README.md
          test -f pyproject.toml
          test -f src/core_lite/cli.py
          test -f tests/test_core_lite.py
          test -f .github/workflows/test.yml
          echo "Installed layout:"
          find . -maxdepth 4 -type f | sort

      - name: Commit installed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install core-lite clean v001 bundle" || echo "No changes to commit"
          git push
