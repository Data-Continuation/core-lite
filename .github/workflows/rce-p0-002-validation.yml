name: RCE P0-002 Validation

on:
  pull_request:
    paths:
      - "docs/RCE_P0_002_MANIFEST_AND_FIXTURES.md"
      - "schemas/execution_candidate_manifest.schema.json"
      - "samples/execution_candidate_manifest.allow.example.json"
      - "samples/execution_candidate_manifest.stale_state.example.json"
      - "samples/execution_candidate_manifest.scope_leakage.example.json"
      - "tools/validate_execution_candidate_manifest.py"
      - "tests/test_execution_candidate_manifest.py"
      - "core_lite/tasks/relationship_conditioned_execution_p0_002.json"
      - ".github/workflows/rce-p0-002-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rce-p0-002:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Validate allow fixture
        id: allow
        run: python tools/validate_execution_candidate_manifest.py samples/execution_candidate_manifest.allow.example.json

      - name: Validate stale-state fixture
        id: stale
        run: python tools/validate_execution_candidate_manifest.py samples/execution_candidate_manifest.stale_state.example.json

      - name: Validate scope-leakage fixture
        id: scope
        run: python tools/validate_execution_candidate_manifest.py samples/execution_candidate_manifest.scope_leakage.example.json

      - name: Run focused manifest tests
        id: tests
        run: python -m pytest -q tests/test_execution_candidate_manifest.py

      - name: Create validation receipt
        if: always()
        env:
          ALLOW_OUTCOME: ${{ steps.allow.outcome }}
          STALE_OUTCOME: ${{ steps.stale.outcome }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          paths = [
              "docs/RCE_P0_002_MANIFEST_AND_FIXTURES.md",
              "schemas/execution_candidate_manifest.schema.json",
              "samples/execution_candidate_manifest.allow.example.json",
              "samples/execution_candidate_manifest.stale_state.example.json",
              "samples/execution_candidate_manifest.scope_leakage.example.json",
              "tools/validate_execution_candidate_manifest.py",
              "tests/test_execution_candidate_manifest.py",
          ]

          outcomes = {
              "allow_fixture": os.environ.get("ALLOW_OUTCOME"),
              "stale_state_fixture": os.environ.get("STALE_OUTCOME"),
              "scope_leakage_fixture": os.environ.get("SCOPE_OUTCOME"),
              "focused_tests": os.environ.get("TEST_OUTCOME"),
          }

          receipt = {
              "schema": "stegverse.validation.receipt.v1",
              "receipt_id": f"rce-p0-002-github-actions-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
              "task_id": "RCE-P0-002",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "validation_class": "GITHUB_ACTIONS_AUTHORITATIVE_VALIDATION",
              "authoritative_completion_evidence": all(value == "success" for value in outcomes.values()),
              "outcomes": outcomes,
              "source_sha256": {
                  value: hashlib.sha256(Path(value).read_bytes()).hexdigest()
                  for value in paths
              },
              "commands": [
                  "python tools/validate_execution_candidate_manifest.py samples/execution_candidate_manifest.allow.example.json",
                  "python tools/validate_execution_candidate_manifest.py samples/execution_candidate_manifest.stale_state.example.json",
                  "python tools/validate_execution_candidate_manifest.py samples/execution_candidate_manifest.scope_leakage.example.json",
                  "python -m pytest -q tests/test_execution_candidate_manifest.py",
              ],
          }

          Path("rce-p0-002-validation-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload authoritative validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rce-p0-002-validation-receipt
          path: rce-p0-002-validation-receipt.json
          if-no-files-found: error
          retention-days: 90
