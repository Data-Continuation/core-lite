name: StegClaw Intake Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core_lite/stegclaw_target_intake.json'
      - 'tools/validate_stegclaw_intake.py'
      - 'docs/STEGCLAW_TARGET_INTAKE.md'
      - 'docs/STEGCLAW_INTAKE_ARTIFACT_MIRROR_HANDOFF.md'
      - '.github/workflows/stegclaw-intake-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'core_lite/stegclaw_target_intake.json'
      - 'tools/validate_stegclaw_intake.py'
      - 'docs/STEGCLAW_TARGET_INTAKE.md'
      - 'docs/STEGCLAW_INTAKE_ARTIFACT_MIRROR_HANDOFF.md'
      - '.github/workflows/stegclaw-intake-validation.yml'

permissions:
  contents: read

jobs:
  validate-stegclaw-intake:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate static StegClaw target intake
        run: python tools/validate_stegclaw_intake.py
      - name: Verify target report
        run: python -m json.tool reports/stegclaw_target_intake.json >/dev/null
      - name: Upload validation-only StegClaw intake artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-lite-stegclaw-intake
          path: reports/stegclaw_target_intake.json
          if-no-files-found: error
