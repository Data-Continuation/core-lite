version: 1

registry:
  name: Core-Lite Bundle Registry
  purpose: >
    Track StegVerse ZIP bundle inventory, canonical current bundles, supersession,
    obsolete bundle churn, and estimated handling friction.
  rule: Bundle-only delivery is valid. Untracked bundle proliferation is not.
  observed_external_inventory:
    source: user_ios_files_screenshot
    folder_name: ZIPs
    observed_item_count: 869
    observed_at: 2026-05-08
    note: >
      The ZIPs folder count is a local inventory signal. Not every item is a
      failure. The registry separates intentional bundle-only development from
      avoidable corrective or obsolete bundle churn.

defaults:
  estimated_handling_minutes_per_bundle_low: 3
  estimated_handling_minutes_per_bundle_likely: 6
  estimated_handling_minutes_per_bundle_high: 10

status_values:
  - current
  - superseded
  - obsolete
  - quarantine
  - failed
  - historical

classes:
  - productive_required
  - versioned_development
  - superseded_legitimate
  - corrective_rework
  - avoidable_failure_churn
  - obsolete_unknown

bundles:
  - id: B-CORELITE-001
    name: core-lite-parallel-transition-control.zip
    workstream_id: W2
    class: versioned_development
    status: superseded
    purpose: Initial parallel transition control surface.
    supersedes: []
    superseded_by: B-CORELITE-003
    source_only: false
    generated_artifacts_included: true
    contains_markdown: true
    verification_result: pass_with_cleanup_needed
    notes: Included generated reports/receipts and needed iPhone-visible correction.

  - id: B-CORELITE-002
    name: core-lite-parallel-transition-control-source-only.zip
    workstream_id: W2
    class: corrective_rework
    status: superseded
    purpose: Remove generated reports and receipts from source bundle.
    supersedes:
      - B-CORELITE-001
    superseded_by: B-CORELITE-003
    source_only: true
    generated_artifacts_included: false
    contains_markdown: true
    verification_result: superseded
    notes: Corrected source/runtime artifact mixing but still carried hidden workflow path issue.

  - id: B-CORELITE-003
    name: core-lite-parallel-transition-control-iphone-visible.zip
    workstream_id: W2
    class: corrective_rework
    status: superseded
    purpose: Make workflow path visible on iPhone by using visible bundle path.
    supersedes:
      - B-CORELITE-002
    superseded_by: B-CORELITE-004
    source_only: true
    generated_artifacts_included: false
    contains_markdown: true
