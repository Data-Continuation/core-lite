version: 1

families:
  observation: 0xx
  classification: 1xx
  mechanical_mutation: 2xx
  completion: 3xx
  verification: 4xx
  receipts: 5xx
  human_boundary: 6xx
  communications: 7xx
  forbidden_high_risk: 9xx

blocks:
  - id: OBSERVE_REPO
    family: observation
    purpose: Inspect repository files, manifests, workflows, and links without mutation.
    allowed_when:
      - repository path exists
      - scan target is inside the repository
    allowed_mutation: []
    forbidden_mutation:
      - modify files
      - delete files
      - create service folders
    verification:
      - scan result exists
    receipt_type: transition.observe_repo

  - id: CLASSIFY_ARTIFACT
    family: classification
    purpose: Classify files or artifacts by reality state.
    allowed_when:
      - artifact was observed
    allowed_mutation:
      - write classification report
    forbidden_mutation:
      - change classified artifact
      - delete classified artifact
    verification:
      - every classified artifact has a class
      - every classification has an evidence note
    receipt_type: transition.classify_artifact

  - id: DETECT_STUB
    family: classification
    purpose: Identify placeholder, TODO-only, mock-only, pass-through, or nonfunctional files.
    allowed_when:
      - artifact was observed
    allowed_mutation:
      - write stub finding
    forbidden_mutation:
      - delete stub without a separate approved block
      - complete stub without a separate completion block
    verification:
      - stub evidence is recorded
    receipt_type: transition.detect_stub

  - id: DETECT_STUB_DEPENDENCY
    family: classification
    purpose: Identify files that appear real but depend on stubbed behavior elsewhere.
    allowed_when:
      - dependency map exists
      - stub finding exists
    allowed_mutation:
      - write stub dependency finding
    forbidden_mutation:
      - modify dependent file without completion or repair block
    verification:
      - dependency edge is recorded
    receipt_type: transition.detect_stub_dependency

  - id: MAP_DEPENDENCY
    family: observation
    purpose: Map imports, links, workflow references, package scripts, and declared dependencies.
    allowed_when:
      - repository path exists
    allowed_mutation:
      - write dependency map report
    forbidden_mutation:
      - install dependencies
      - rewrite imports
    verification:
      - dependency map exists
    receipt_type: transition.map_dependency

  - id: AUTO_FIX_MECHANICAL
    family: mechanical_mutation
    purpose: Apply safe, mechanical, reversible changes when evidence is unambiguous.
    allowed_when:
      - target file is not canonical
      - target file is not public-claim-bearing unless fix is link-only
      - mutation is reversible
      - rollback entry can be generated
    allowed_mutation:
      - fix obviously broken local links
      - normalize obvious script/report path mismatches
      - create missing report directories
      - remove duplicate generated outputs when clearly generated
    forbidden_mutation:
      - change product meaning
      - change canonical formalism language
      - change pricing
      - change deployment behavior
      - delete non-empty files
    verification:
      - changed files are listed
      - rollback entry exists
      - validator still passes
    receipt_type: transition.auto_fix_mechanical

  - id: AUTO_QUARANTINE_STUB
    family: mechanical_mutation
    purpose: Move or mark inactive stubs so active repo paths no longer rely on fake infrastructure.
    allowed_when:
      - file is classified as STUB
      - file has no active import or public canonical role
      - rollback path can be generated
    allowed_mutation:
      - move inactive stub to quarantine path
      - write quarantine manifest
      - mark inactive stub in report
    forbidden_mutation:
      - permanently delete file
      - quarantine canonical artifact
      - quarantine public page without review
      - quarantine deployment file without review
    verification:
      - dependency graph still resolves
      - quarantine manifest exists
      - rollback manifest exists
    receipt_type: transition.auto_quarantine_stub

  - id: COMPLETE_LOW_RISK_STUB
    family: completion
    purpose: Replace a low-risk placeholder with a minimal working implementation when intended behavior is explicit.
    allowed_when:
      - file is classified as STUB
      - intended behavior is documented nearby
      - implementation is local and bounded
      - no public claim or canonical definition changes
    allowed_mutation:
      - replace placeholder logic with minimal working logic
      - wire declared script to existing tool
      - generate report from existing scan data
    forbidden_mutation:
      - invent new product architecture
      - add unused service tree
      - change formalism definitions
      - add provider credentials
      - deploy
    verification:
      - syntax check passes
      - declared command runs
      - generated output exists if required
    receipt_type: transition.complete_low_risk_stub

  - id: GENERATE_ROLLBACK
    family: mechanical_mutation
    purpose: Produce a rollback manifest for any bounded mutation.
    allowed_when:
      - mutation plan exists
    allowed_mutation:
      - write rollback manifest
    forbidden_mutation:
      - mutate target files
    verification:
      - rollback manifest includes every changed path
    receipt_type: transition.generate_rollback

  - id: VERIFY_REPO
    family: verification
    purpose: Run available syntax, manifest, workflow, and report checks.
    allowed_when:
      - repository path exists
    allowed_mutation:
      - write verification report
    forbidden_mutation:
      - change files to make checks pass
    verification:
      - verification result exists
    receipt_type: transition.verify_repo

  - id: VERIFY_PUBLIC_LINKS
    family: verification
    purpose: Verify public page links and site navigation targets when site files are present.
    allowed_when:
      - site files are present
    allowed_mutation:
      - write link report
    forbidden_mutation:
      - change public claims
      - change domain routing
    verification:
      - link report exists
    receipt_type: transition.verify_public_links

  - id: VERIFY_BLOCK_REFERENCE
    family: verification
    purpose: Ensure workstreams reference only defined transition blocks.
    allowed_when:
      - transition block registry exists
      - workstream registry exists
    allowed_mutation:
      - write validation report
    forbidden_mutation:
      - change registries
    verification:
      - all block references resolve
    receipt_type: transition.verify_block_reference

  - id: WRITE_RECEIPT
    family: receipts
    purpose: Write a receipt for observed, classified, mutated, verified, or human-reviewed transitions.
    allowed_when:
      - event has a timestamp
      - event has a workstream or block reference
    allowed_mutation:
      - append receipt to receipt log
    forbidden_mutation:
      - rewrite previous receipt entries
    verification:
      - receipt entry exists
    receipt_type: transition.write_receipt

  - id: ASK_BOUNDARY_DECISION
    family: human_boundary
    purpose: Ask the user only when a transition reaches a product, canonical, security, deletion, or irreversible boundary.
    allowed_when:
      - proposed action requires human review
    allowed_mutation:
      - write pending decision
      - write decision report
    forbidden_mutation:
      - execute the pending action
    verification:
      - pending decision has allowed replies
    receipt_type: transition.ask_boundary_decision

  - id: TASK_INGEST
    family: observation
    purpose: Normalize a user task into a bounded workstream event.
    allowed_when:
      - task text exists
    allowed_mutation:
      - write normalized task event
    forbidden_mutation:
      - execute task directly
    verification:
      - normalized event exists
    receipt_type: transition.task_ingest

  - id: BUILD_PROVIDER_ADAPTER
    family: completion
    purpose: Build a minimal model-provider adapter only when the Headless LLM workstream is unblocked.
    allowed_when:
      - workstream permits provider adapter build
      - provider contract is explicit
    allowed_mutation:
      - create or modify provider adapter file
    forbidden_mutation:
      - train foundation model
      - add unused providers
      - store secrets in repo
    verification:
      - adapter can be imported
      - adapter has no hardcoded secret
    receipt_type: transition.build_provider_adapter

  - id: CLASSIFY_OUTPUT
    family: classification
    purpose: Classify model or system output before it becomes effect-capable.
    allowed_when:
      - output exists
    allowed_mutation:
      - write classification result
    forbidden_mutation:
      - execute model output
    verification:
      - classification is one of allowed routing classes
    receipt_type: transition.classify_output

  - id: DEFINE_TRANSITION_BLOCK
    family: completion
    purpose: Add or refine executable transition block definitions.
    allowed_when:
      - block purpose is explicit
      - allowed and forbidden mutations are specified
    allowed_mutation:
      - add transition block definition
      - refine transition block metadata
    forbidden_mutation:
      - add high-risk mutation block without review
      - change canonical formalism language without review
    verification:
      - block validates against schema
    receipt_type: transition.define_transition_block

  - id: CLASSIFY_TRANSITION_BLOCK
    family: classification
    purpose: Assign a transition block to a family and risk tier.
    allowed_when:
      - transition block exists
    allowed_mutation:
      - write block classification
    forbidden_mutation:
      - change block behavior
    verification:
      - block family is known
    receipt_type: transition.classify_transition_block

  - id: RECEIVE_MESSAGE
    family: communications
    purpose: Receive an inbound communication event without granting it execution authority.
    allowed_when:
      - message payload exists
    allowed_mutation:
      - write inbound message event
    forbidden_mutation:
      - execute message instruction
    verification:
      - inbound event is normalized
    receipt_type: transition.receive_message

  - id: NORMALIZE_MESSAGE
    family: communications
    purpose: Normalize provider-specific communication payloads into StegVerse events.
    allowed_when:
      - inbound or outbound message exists
    allowed_mutation:
      - write normalized message event
    forbidden_mutation:
      - approve action from provider data alone
    verification:
      - normalized event has channel, actor, body, and timestamp
    receipt_type: transition.normalize_message

  - id: MAP_ACTOR
    family: communications
    purpose: Map a communication sender or channel to a known actor role.
    allowed_when:
      - sender or channel identifier exists
    allowed_mutation:
      - write actor mapping result
    forbidden_mutation:
      - create new high-trust actor without review
    verification:
      - actor confidence is recorded
    receipt_type: transition.map_actor

  - id: PARSE_DECISION_CODE
    family: communications
    purpose: Parse decision codes from constrained human replies.
    allowed_when:
      - inbound message body exists
    allowed_mutation:
      - write parsed command event
    forbidden_mutation:
      - execute command
    verification:
      - command and decision code are recorded
    receipt_type: transition.parse_decision_code

  - id: SEND_MESSAGE
    family: communications
    purpose: Send a bounded outbound message through an approved channel.
    allowed_when:
      - recipient role is known
      - channel is approved for the message class
      - message body is bounded
    allowed_mutation:
      - send message through provider
      - write outbound receipt
    forbidden_mutation:
      - send bulk marketing
      - send secrets
      - send unapproved production authorization prompts
    verification:
      - delivery attempt receipt exists
    receipt_type: transition.send_message

  - id: CLASSIFY_CHANNEL
    family: communications
    purpose: Classify a communication channel by role, trust level, and allowed use.
    allowed_when:
      - channel identifier exists
    allowed_mutation:
      - write channel classification
    forbidden_mutation:
      - publish channel
      - grant execution authority
    verification:
      - channel role is recorded
    receipt_type: transition.classify_channel

  - id: DEFINE_AUTHORITY_BOUNDARY
    family: human_boundary
    purpose: Define what a channel, actor, workstream, or transition block is not allowed to do.
    allowed_when:
      - boundary target exists
    allowed_mutation:
      - write authority boundary
    forbidden_mutation:
      - execute bounded action
    verification:
      - forbidden actions are recorded
    receipt_type: transition.define_authority_boundary

  - id: BLOCK_START_OVER
    family: forbidden_high_risk
    purpose: Prevent replacing an existing artifact with a new artifact when the task is to continue, complete, or repair.
    allowed_when:
      - proposed action attempts restart
    allowed_mutation:
      - write blocked-action receipt
    forbidden_mutation:
      - create replacement repo
      - create replacement service
      - discard existing artifact
    verification:
      - blocked reason is recorded
    receipt_type: transition.block_start_over

  - id: CREATE_NEW_REPO
    family: forbidden_high_risk
    purpose: Prevent creating a new repository when the active workstream is to continue, complete, repair, or classify existing artifacts.
    allowed_when:
      - proposed action attempts to create a repository outside the active workstream completion path
    allowed_mutation:
      - write blocked-action receipt
      - write pending boundary decision if user explicitly requested new repository creation
    forbidden_mutation:
      - create repository
      - replace existing artifact with new repository
      - move current task into a new repo without approval
    verification:
      - blocked reason is recorded
    receipt_type: transition.block_create_new_repo

  - id: DIRECT_REPO_MUTATION_FROM_LLM
    family: forbidden_high_risk
    purpose: Prevent model output from mutating repository files unless the mutation is routed through an allowed transition block.
    allowed_when:
      - model output proposes direct repository mutation
    allowed_mutation:
      - write blocked-action receipt
      - convert model output into proposed transition for classification
    forbidden_mutation:
      - write model output directly to source files
      - delete files from model output alone
      - execute shell commands from model output alone
    verification:
      - proposed mutation is classified before any file change
    receipt_type: transition.block_direct_repo_mutation_from_llm

  - id: TRAIN_FOUNDATION_MODEL
    family: forbidden_high_risk
    purpose: Prevent the Headless LLM workstream from drifting into foundation-model training when the current goal is governed runtime construction.
    allowed_when:
      - proposed action attempts foundation-model training or fine-tuning outside an approved training workstream
    allowed_mutation:
      - write blocked-action receipt
      - write future-work note if relevant
    forbidden_mutation:
      - start training job
      - create model-training scaffold
      - add training-data pipeline
      - upload private ecosystem data for training
    verification:
      - blocked reason is recorded
    receipt_type: transition.block_train_foundation_model

  - id: BULK_MARKETING
    family: forbidden_high_risk
    purpose: Prevent communications workstreams from becoming marketing, campaign, or mass-messaging systems before governed communication controls exist.
    allowed_when:
      - proposed action attempts bulk, campaign, broadcast, or marketing messaging
    allowed_mutation:
      - write blocked-action receipt
      - write pending boundary decision if explicitly requested
    forbidden_mutation:
      - send bulk messages
      - create campaign workflow
      - import contact list
      - configure marketing provider flow
    verification:
      - blocked reason is recorded
    receipt_type: transition.block_bulk_marketing

  - id: UNBOUNDED_CHATBOT
    family: forbidden_high_risk
    purpose: Prevent communication channels from becoming unconstrained chatbots outside Core-Lite classification, receipts, and transition-block permissioning.
    allowed_when:
      - proposed action allows open-ended communication without workstream, thread, decision, or receipt constraints
    allowed_mutation:
      - write blocked-action receipt
      - convert request into bounded communication event contract
    forbidden_mutation:
      - create unconstrained chatbot service
      - allow free-form messages to execute actions
      - bypass decision codes
      - bypass receipts
    verification:
      - bounded event contract is recorded before implementation
    receipt_type: transition.block_unbounded_chatbot

  - id: MOVE_PERSONAL_NUMBER_TO_PUBLIC_ROLE
    family: forbidden_high_risk
    purpose: Prevent the personal carrier number from becoming a public, product, automation, or StegVerse command endpoint.
    allowed_when:
      - proposed action assigns a personal number to public or operational StegVerse use
    allowed_mutation:
      - write blocked-action receipt
      - write channel-boundary note
    forbidden_mutation:
      - publish personal number
      - assign personal number to SMS Bridge
      - use personal number for product intake
      - use personal number for repo automation commands
    verification:
      - personal number remains outside public and operational channel roles
    receipt_type: transition.block_move_personal_number_to_public_role

  - id: CHANGE_CANONICAL_FORMALISM_WITHOUT_REVIEW
    family: forbidden_high_risk
    purpose: Prevent canonical formalism definitions, axioms, theorem language, or repo identity from changing without explicit human review.
    allowed_when:
      - proposed action changes canonical formalism content without review
    allowed_mutation:
      - write blocked-action receipt
      - write pending boundary decision
    forbidden_mutation:
      - change canonical definitions
      - rename formalism families
      - alter theorem or axiom language
      - replace canonical repo content with generated content
    verification:
      - human-review boundary decision exists before mutation
    receipt_type: transition.block_change_canonical_formalism_without_review

  - id: MEASURE_FRICTION_AVOIDED
    family: receipts
    purpose: Measure avoidable human recovery burden prevented by governed execution.
    allowed_when: [friction event registry exists]
    allowed_mutation: [write friction avoided report, append friction avoided receipt]
    forbidden_mutation: [mutate source files, execute remediation actions]
    verification: [total estimates are computed, receipt exists]
    receipt_type: transition.measure_friction_avoided

  - id: VERIFY_WORKFLOW_DEPENDENCIES
    family: verification
    purpose: Verify workflow-called scripts have required dependencies installed before execution.
    allowed_when: [workflow file exists]
    allowed_mutation: [write dependency verification report]
    forbidden_mutation: [run workflow without dependency check]
    verification: [import requirements are mapped to install steps]
    receipt_type: transition.verify_workflow_dependencies

  - id: VERIFY_WORKFLOW_PATH
    family: verification
    purpose: Verify workflow files are visible for upload and located where GitHub Actions will recognize them.
    allowed_when: [workflow file is included]
    allowed_mutation: [write workflow path verification report, write upload mapping]
    forbidden_mutation: [hide the only workflow copy in an iPhone-invisible path]
    verification: [visible path and GitHub-recognized path are documented]
    receipt_type: transition.verify_workflow_path

  - id: VERIFY_BUNDLE_CONTENTS
    family: verification
    purpose: Verify source bundles contain only intended source files unless generated artifacts are explicitly requested.
    allowed_when: [bundle path exists]
    allowed_mutation: [write bundle content report]
    forbidden_mutation: [include generated reports in source-only bundle, include generated receipts in source-only bundle]
    verification: [source and generated files are separated]
    receipt_type: transition.verify_bundle_contents

  - id: VERIFY_ARTIFACT_UPLOAD
    family: verification
    purpose: Verify generated Markdown, JSON, and receipt outputs are uploaded as downloadable artifacts.
    allowed_when: [workflow produces reports or receipts]
    allowed_mutation: [write artifact upload verification report]
    forbidden_mutation: [leave Markdown only in logs]
    verification: [upload-artifact step includes required files]
    receipt_type: transition.verify_artifact_upload

  - id: VERIFY_RESPONSE_CONSTRAINTS
    family: verification
    purpose: Verify assistant output respects file, path, bundle, Markdown, and full-replacement constraints.
    allowed_when: [response contains artifact instructions or file paths]
    allowed_mutation: [write response-constraint report]
    forbidden_mutation: [provide partial patches, display leading-dot paths without note, provide non-downloadable Markdown]
    verification: [response constraints are checked before delivery]
    receipt_type: transition.verify_response_constraints

  - id: DEFINE_DONE_STATE
    family: human_boundary
    purpose: Define what done means before building or mutating.
    allowed_when: [build or mutation task is initiated]
    allowed_mutation: [write done definition]
    forbidden_mutation: [build before done criteria are declared]
    verification: [done criteria are explicit and testable]
    receipt_type: transition.define_done_state

  - id: CONTINUITY_REGISTRY_CHECK
    family: observation
    purpose: Check whether an existing artifact already serves a proposed role before suggesting or creating a new artifact.
    allowed_when: [proposed action creates or names an artifact]
    allowed_mutation: [write continuity check result]
    forbidden_mutation: [propose replacement artifact before checking existing artifacts]
    verification: [existing artifact decision is recorded]
    receipt_type: transition.continuity_registry_check

  - id: DEFINE_UPLOAD_MAP
    family: verification
    purpose: Define how iPhone-visible bundle paths map to GitHub-recognized repository paths.
    allowed_when: [bundle includes workflow files]
    allowed_mutation: [write upload map]
    forbidden_mutation: [rely on hidden paths without visible mapping]
    verification: [upload map exists]
    receipt_type: transition.define_upload_map

  - id: VERIFY_SOURCE_ONLY_BUNDLE
    family: verification
    purpose: Verify a source bundle is not polluted with generated runtime artifacts.
    allowed_when: [source-only bundle is generated]
    allowed_mutation: [write source-only verification report]
    forbidden_mutation: [include generated reports, include generated receipts]
    verification: [no generated report or receipt directory is present unless requested]
    receipt_type: transition.verify_source_only_bundle

  - id: VERIFY_CLASSIFIER_FALSE_POSITIVES
    family: verification
    purpose: Detect and reduce false-positive maintainer classifications before recommending mutation.
    allowed_when: [maintainer classification report exists]
    allowed_mutation: [write false-positive review report]
    forbidden_mutation: [quarantine or complete files based only on low-confidence classifier signals]
    verification: [false-positive-prone patterns are listed]
    receipt_type: transition.verify_classifier_false_positives
